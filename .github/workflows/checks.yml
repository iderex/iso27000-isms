# Ruft die drei Prüfungen aus CONTRIBUTING.md, Abschnitt 10, auf, und vor ihnen
# die drei Beweise, die daneben liegen. Ein Beweis, der nicht mehr beißt, macht
# die Aussage der zugehörigen Prüfung wertlos, deshalb laufen die Beweise
# zuerst und die Prüfungen erst danach.
#
# Calls the three checks from CONTRIBUTING.md, section 20, and ahead of them the
# three proofs that sit beside them. A proof that no longer bites makes the
# statement of its check worthless, so the proofs run first and the checks only
# after them.
#
# Was dieser Ablauf nicht tut: einen Beitrag zurückweisen. Das Regelwerk auf
# `main` führt keine erforderliche Prüfung, und ein roter Lauf verhindert das
# Zusammenführen deshalb nicht. Er ist sichtbar und nicht bindend.
#
# What this run does not do: refuse a contribution. The ruleset on `main`
# carries no required status check, so a red run does not stop a merge. It is
# visible and not binding.

name: Prüfungen / Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proofs:
    name: Beweise / Proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fassung von Python / Version of Python
        run: python3 --version
      - name: Beweis der Verweisprüfung / Proof of the link check
        run: python3 scripts/check-links-test.py
      - name: Beweis der CSV-Prüfung / Proof of the CSV check
        run: python3 scripts/check-csv-test.py
      - name: Beweis der Übersetzungsprüfung / Proof of the translation check
        run: python3 scripts/check-translations-test.py

  checks:
    name: Prüfungen / Checks
    needs: proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verweise / Links
        run: python3 scripts/check-links.py .
      - name: CSV-Dateien / CSV files
        run: python3 scripts/check-csv.py .
      - name: Übersetzungen / Translations
        run: python3 scripts/check-translations.py .
