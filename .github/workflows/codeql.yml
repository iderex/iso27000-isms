# Deutsch: Codeanalyse über die sechs Python-Skripte unter scripts/. Der
# übrige Baum ist Inhalt, kein Code, und die Analyse liest ihn nicht.
#
# Dieser Ablauf steht hier und nicht in CONTRIBUTING.md, Abschnitt 10, weil
# er kein Befehl ist, den ein Beitragender örtlich ausführt. Die Analyse
# läuft als Dienst von GitHub und meldet in den Reiter für Codeanalyse;
# eine zweite Stelle, die auseinanderlaufen könnte, entsteht dadurch nicht.
#
# Wie bei den Prüfungen aus checks.yml gilt: ein roter Lauf weist keinen
# Beitrag zurück. Das Regelwerk auf main führt keine erforderliche Prüfung,
# und diese Datei ändert das nicht.
#
# English: code analysis over the six Python scripts under scripts/. The
# rest of the tree is content, not code, and the analysis does not read it.
#
# This workflow stands here and not in CONTRIBUTING.md, section 20, because
# it is not a command a contributor runs locally. The analysis runs as a
# GitHub service and reports into the code scanning tab; a second place
# that could drift does not come into being.
#
# As with the checks from checks.yml: a red run does not refuse a
# contribution. The ruleset on main carries no required check, and this
# file does not change that.
name: CodeQL

on:
  push:
    branches: [main]
    # Deutsch: Ein Push, der kein Python berührt, ändert nichts an dem, was
    # die Analyse liest. English: a push that touches no Python changes
    # nothing the analysis reads.
    paths:
      - "**/*.py"
      - ".github/workflows/codeql.yml"
  # Deutsch: Der Pull-Request-Auslöser ist nicht gefiltert. Ein Filter dort
  # macht die Prüfung nicht rot, sondern stumm, und ein Urteil, das fehlt,
  # sieht aus wie eines, das bestanden wurde. English: the pull request
  # trigger is not filtered. A filter there does not make the check red, it
  # makes it silent, and a missing verdict looks like a passed one.
  pull_request:
    branches: [main]
  # Deutsch: Ein wöchentlicher Lauf, damit ein Abfragepaket, das etwas Neues
  # gelernt hat, es gegen den unveränderten Baum sagt. English: a weekly run
  # so a query pack that has learned something new says so against the
  # unchanged tree.
  schedule:
    - cron: "58 3 * * 4"
  workflow_dispatch:

# Deutsch: Nichts auf Ablaufebene; der Auftrag unten bittet um das, was er
# braucht, und nicht mehr. English: nothing at workflow level; the job below
# asks for what it needs and no more.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: python
          # Deutsch: Das Standardpaket findet Sicherheitsfehler, dieses nimmt
          # die Qualitätsabfragen dazu. English: the default pack finds
          # security faults, this one adds the quality queries.
          queries: +security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:python"
