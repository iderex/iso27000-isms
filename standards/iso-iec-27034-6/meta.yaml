    note: >
      Fremde Fallbeispiele sind kein Gegenstand einer Sitzung der Leitung. Was
      sie an dieser Reihe angeht, steht im Foliensatz zu ISO/IEC 27016.
  practitioners:
    needed: false
    note: >
      Ein Fallbeispiel wird gelesen und nicht vorgetragen. Der Nutzen entsteht
      beim Vergleich mit der eigenen Lage, und der geschieht am eigenen
      Bestand.
  engineering:
    needed: false
    note: >
      Der Foliensatz zu ISO/IEC 27034-1 trägt die beiden Gedanken der Reihe.
      Ein Satz aus fremden Beispielen würde eine fremde Antwort vortragen, und
      genau davor warnt dieses Kapitel.
  all-staff:
    needed: false
    note: >
      Für alle Beschäftigten haben fremde Fallbeispiele zur Entwicklung keine
      Handlungsfolge.
  auditors:
    needed: false
    note: >
      Wer prüft, prüft gegen das, was die geprüfte Organisation entschieden
      hat, und nicht gegen ein Beispiel aus einer Norm.
