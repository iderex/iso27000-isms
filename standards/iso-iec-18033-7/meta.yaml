    note: >
      Ein Satz gehört in die Hand der Technik: der zweite Eingang macht
      denselben Schlüssel an verschiedenen Stellen verschieden wirksam, und
      genau deshalb muss er je Stelle verschieden sein. Wird er wiederholt,
      wird auch die Wirkung wiederholt.
