languages:
  - de
  - en
presentation:
  management:
    needed: true
    note: >
      Zwei Sätze gehören in die Hand der Leitung: eine Herausgabe hat keinen
      natürlichen Eigentümer im Haus, und der Aufwand wird gegen den Streitwert
      abgewogen. Wer beides nicht vorher entscheidet, entscheidet es unter
      Frist und ohne Zahlen.
  practitioners:
    needed: true
    note: >
      Ein Satz gehört in die Hand der Praxis: die Anordnung, nicht mehr zu
      löschen, braucht eine Stelle, die sie erteilt, und eine, die sie
      aufhebt. Eine Anordnung ohne Ende bleibt für immer stehen und wird
      irgendwann ignoriert.
  engineering:
    needed: false
    note: >
      Für die Technik steht der Stoff im vierten Teil. Dieser Teil regelt
      Zuständigkeit und Abwägung und beschreibt keine Anlage.
  all-staff:
    needed: false
    note: >
      Für alle Beschäftigten hat die Frage der Zuständigkeit keine
      Handlungsfolge, solange sie keine Anordnung erhalten haben.
  auditors:
    needed: false
    note: >
      Wer prüft, sieht nach, ob eine benannte Stelle besteht und ob eine
      erteilte Anordnung ein Datum und eine Aufhebung kennt. Das sind Punkte
      in der Prüfung und kein eigener Kursstoff.
