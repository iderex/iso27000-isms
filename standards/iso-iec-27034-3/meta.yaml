presentation:
  management:
    needed: false
    note: >
      Die Leitung sieht das Ergebnis dieses Weges, nämlich eine Anwendung mit
      einer Begründung und einem Nachweis, und nicht den Weg. Was sie
      abzuwägen hat, steht im Foliensatz zu ISO/IEC 27016.
  practitioners:
    needed: false
    note: >
      Dieser Weg ist derselbe Ablauf wie eine Risikobeurteilung mit
      anschließender Auswahl von Maßnahmen, nur auf eine Anwendung gerichtet.
      Der Foliensatz zu ISO/IEC 27005 trägt ihn bereits.
  engineering:
    needed: false
    note: >
      Der Foliensatz zu ISO/IEC 27034-1 trägt die beiden Gedanken der Reihe.
      Der Weg hier hängt am Bestand des jeweiligen Hauses und wird an einem
      echten Vorhaben gelernt.
  all-staff:
    needed: false
    note: >
      Für alle Beschäftigten hat der Ablauf eines Entwicklungsvorhabens keine
      Handlungsfolge.
  auditors:
    needed: false
    note: >
      Wer prüft, sieht sich den Nachweis am Ende dieses Weges an. Das ist ein
      Punkt in der Prüfung und kein eigener Kursstoff.
