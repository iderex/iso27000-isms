id: iso-iec-11770-5
number: 11770
part: 5
edition_year: 2020
doc_type: is
status: published
family: cryptography
layer: depth
isms_relation: controls
catalog_confirmation: confirmed
languages:
  - de
  - en
presentation:
  management:
    needed: false
    note: >
      Die Wahl eines Verfahrens ist keine Entscheidung der Leitung. Was sie an
      der Schlüsselverwaltung angeht, steht im Foliensatz zu ISO/IEC 27099.
  practitioners:
    needed: false
    note: >
      Die Praxis regelt, wer welche Daten sehen darf, und der Foliensatz zu
      ISO/IEC 27002 trägt das. Wie ein Schlüssel für eine wechselnde Gruppe
      entsteht, ist eine technische Frage darunter.
  engineering:
    needed: false
    note: >
      Der Foliensatz zu ISO/IEC 11770-1 trägt den Lebensweg eines Schlüssels
      für diese ganze Reihe. Eine Gruppe zu verschlüsseln ist ein Entwurf mit
      einer eigenen Gruppe im Rücken, und ohne sie hätte ein Foliensatz keinen
      Gegenstand.
  all-staff:
    needed: false
    note: >
      Für alle Beschäftigten hat die Verschlüsselung für eine Gruppe keine
      Handlungsfolge über die Regeln zum Umgang mit Daten hinaus.
  auditors:
    needed: false
    note: >
      Wer prüft, sieht nach, ob der Entzug von Rechten wirkt. Dass er bei einer
      Gruppenverschlüsselung einen Schlüsselwechsel bedeutet, ist ein Punkt in
      der Prüfung und kein eigener Kursstoff.
