languages:
  - de
  - en
presentation:
  management:
    needed: false
    note: >
      Die Leitung entscheidet, ob es überhaupt eine Stelle gibt, die im
      Ernstfall gerufen wird, und ob ein Gerät stillgelegt werden darf.
      Beides steht im Foliensatz zu ISO/IEC 27001 beim Geltungsbereich und
      im Foliensatz zu ISO/IEC 27005 bei der Übernahme eines Risikos.
  practitioners:
    needed: true
    note: >
      Ein Satz gehört in die Hand der Praxis: über den Wert eines
      Beweismittels entscheidet die erste Viertelstunde, und in dieser
      Viertelstunde ist selten jemand da, der davon etwas versteht. Daraus
      folgt eine Festlegung vor dem Vorfall und keine Entscheidung am
      Schreibtisch.
  engineering:
    needed: false
    note: >
      Für die Technik ist der Stoff hier zu dünn. Was ein laufendes System
      hergibt und was beim Abschalten verloren geht, gehört in den
      Foliensatz zur Vorfallbehandlung und nicht in einen eigenen.
  all-staff:
    needed: true
    note: >
      Für alle Beschäftigten bleibt eine einzige Anweisung übrig, und die
      lohnt eine Folie: nichts abschalten, nichts aufräumen, nichts
      nachsehen, sondern melden. Wer aufräumt, meint es gut und vernichtet
      dabei genau das, worauf es später ankommt.
  auditors:
    needed: false
    note: >
      Wer prüft, sieht nach, ob eine Festlegung existiert, wer sie kennt und
      ob der letzte Vorfall danach behandelt wurde. Das sind Punkte in der
      Prüfung und kein eigener Kursstoff.
