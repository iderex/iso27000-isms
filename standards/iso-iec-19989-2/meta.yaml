id: iso-iec-19989-2
number: 19989
part: 2
edition_year: 2020
doc_type: is
status: published
family: evaluation-certification
layer: neighbour
isms_relation: controls certification
catalog_confirmation: confirmed
languages:
  - de
  - en
presentation:
  management:
    needed: false
    note: >
      Für die Leitung entsteht hier keine eigene Entscheidung. Ob biometrische
      Merkmale überhaupt eingesetzt werden, ist die Entscheidung, und sie
      steht im Foliensatz zu ISO/IEC 27553-1.
  practitioners:
    needed: true
    note: >
      Ein Satz gehört in die Hand der Praxis: eine einzelne Zahl über die
      Erkennungsleistung sagt nichts, solange nicht dabeisteht, welche der
      beiden Fehlerraten festgehalten wurde und an welcher Bevölkerung
      gemessen wurde.
  engineering:
    needed: true
    note: >
      Für die Technik lohnt ein Satz eine Folie: die Schwelle ist keine
      technische Einstellung, sondern die Festlegung darüber, wer
      ausgesperrt und wer hereingelassen wird.
  all-staff:
    needed: false
    note: >
      Für alle Beschäftigten folgt aus diesem Thema keine eigene Handlung
      neben der Meldung, dass die Anmeldung nicht funktioniert, und die
      gehört in die allgemeine Unterweisung.
  auditors:
    needed: false
    note: >
      Wer prüft, sieht nach, an welcher Bevölkerung gemessen wurde und wer die
      Schwelle festgelegt hat. Das sind Punkte in der Prüfung und kein eigener
      Kursstoff.
