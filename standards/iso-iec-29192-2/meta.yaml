id: iso-iec-29192-2
number: 29192
part: 2
edition_year: 2019
doc_type: is
status: published
family: cryptography
layer: depth
isms_relation: controls
catalog_confirmation: confirmed
languages:
  - de
  - en
presentation:
  management:
    needed: false
    note: >
      Die Wahl einer Chiffre ist keine Entscheidung der Leitung. Was sie an
      dieser Reihe angeht, steht im Foliensatz zu ISO/IEC 29192-1.
  practitioners:
    needed: false
    note: >
      Die Praxis trägt die Regelung zur Kryptografie, und der Weg dorthin steht
      im Foliensatz zu ISO/IEC 27002. Welche Chiffre darunter rechnet, ändert
      an dieser Regelung nichts.
  engineering:
    needed: false
    note: >
      Der Foliensatz zu ISO/IEC 29192-1 trägt den Gedanken für die ganze Reihe.
      Die Rechnung, wie viel unter einem Schlüssel verarbeitet werden darf, ist
      eine Aufgabe im Entwurf und braucht die Zahlen des jeweiligen Erzeugnisses,
      die ein Foliensatz nicht hat.
  all-staff:
    needed: false
    note: >
      Für alle Beschäftigten hat die Wahl einer Chiffre keine Handlungsfolge.
  auditors:
    needed: false
    note: >
      Wer prüft, sieht nach, ob die Grenze für die Menge unter einem Schlüssel
      ausgerechnet und ein Wechsel vorgesehen ist. Das ist ein Punkt in der
      Prüfung und kein eigener Kursstoff.
