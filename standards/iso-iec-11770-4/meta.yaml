id: iso-iec-11770-4
number: 11770
part: 4
edition_year: 2017
doc_type: is
status: published
family: cryptography
layer: depth
isms_relation: controls
catalog_confirmation: confirmed
languages:
  - de
  - en
presentation:
  management:
    needed: false
    note: >
      Die Wahl eines Verfahrens ist keine Entscheidung der Leitung. Was sie an
      der Schlüsselverwaltung angeht, steht im Foliensatz zu ISO/IEC 27099.
  practitioners:
    needed: false
    note: >
      Die Praxis regelt Kennwörter über die Maßnahmen zur Authentisierung, und
      der Foliensatz zu ISO/IEC 27002 trägt sie. Dass ein Kennwort ein
      schwaches Geheimnis ist, steht dort bereits.
  engineering:
    needed: false
    note: >
      Der Foliensatz zu ISO/IEC 11770-1 trägt den Lebensweg eines Schlüssels
      für diese ganze Reihe. Ob eines dieser Verfahren in Frage kommt,
      entscheidet ein Entwurf, und in den meisten Häusern lautet die Antwort,
      dass ein fertiges Protokoll benutzt wird.
  all-staff:
    needed: false
    note: >
      Für alle Beschäftigten zählt, wie ein Kennwort gewählt und aufbewahrt
      wird. Das steht im Awareness-Training und nicht in dieser Norm.
  auditors:
    needed: false
    note: >
      Wer prüft, sieht nach, ob die Regelung zu Kennwörtern besteht und
      eingehalten wird, und nicht, welches Verfahren dahinter rechnet.
