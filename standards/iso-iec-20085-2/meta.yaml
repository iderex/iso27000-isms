presentation:
  management:
    needed: false
    note: >
      Für die Leitung entsteht hier keine eigene Entscheidung. Der Gegenstand
      ist der Abgleich eines Messgeräts in einem Labor.
  practitioners:
    needed: true
    note: >
      Ein Satz gehört in die Hand der Praxis: zwei Labore, die nichts finden,
      sagen nur dann dasselbe, wenn beide Messgeräte dasselbe hätten finden
      können, und das herzustellen ist der Gegenstand dieses Teils.
  engineering:
    needed: false
    note: >
      Für die Technik folgt daraus keine eigene Handlung. Wer kein Labor
      betreibt, gleicht kein Messgerät ab.
  all-staff:
    needed: false
    note: >
      Für alle Beschäftigten folgt aus diesem Thema keine eigene Handlung. Es
      spielt sich in einem Labor ab.
  auditors:
    needed: false
    note: >
      Wer prüft, sieht nach, ob ein vorgelegter Befund einen Abgleich des
      Messgeräts belegt. Das ist ein Punkt in der Prüfung und kein eigener
      Kursstoff.
