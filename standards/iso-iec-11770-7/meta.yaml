presentation:
  management:
    needed: false
    note: >
      Die Wahl eines Verfahrens ist keine Entscheidung der Leitung. Was sie an
      der Schlüsselverwaltung angeht, steht im Foliensatz zu ISO/IEC 27099.
  practitioners:
    needed: false
    note: >
      Die Praxis regelt die Anmeldung über die Maßnahmen zur Authentisierung,
      und der Foliensatz zu ISO/IEC 27002 trägt sie. Der Fall zweier Bereiche
      ist selten und wird im Entwurf entschieden.
  engineering:
    needed: false
    note: >
      Der Foliensatz zu ISO/IEC 11770-1 trägt den Lebensweg eines Schlüssels
      für diese ganze Reihe, und der zugrunde liegende Gedanke steht im Kapitel
      zu ISO/IEC 11770-4. Dieser Teil ist der engste Fall der Reihe, und die
      meisten Leser dieses Repositoriums stehen nicht in ihm.
  all-staff:
    needed: false
    note: >
      Für alle Beschäftigten hat dieser Fall keine Handlungsfolge über die
      Regeln zu Kennwörtern hinaus.
  auditors:
    needed: false
    note: >
      Wer prüft, sieht nach, ob die Anmeldung über Bereichsgrenzen hinweg
      geregelt und aufgezeichnet ist, und nicht, welches Verfahren dahinter
      rechnet.
