id: iso-iec-14888-2
number: 14888
part: 2
edition_year: 2008
doc_type: is
status: published
family: cryptography
layer: depth
isms_relation: controls
catalog_confirmation: confirmed
languages:
  - de
  - en
presentation:
  management:
    needed: false
    note: >
      Die Wahl eines Verfahrens ist keine Entscheidung der Leitung.
  practitioners:
    needed: false
    note: >
      Der Satz, den die Praxis an dieser Reihe braucht, steht im Foliensatz zu
      ISO/IEC 14888-1. Was dieser Teil hinzufügt, gehört in eine Prüfliste für
      den Entwurf.
  engineering:
    needed: true
    note: >
      Ein Satz gehört in die Hand der Technik: bei dieser Familie sitzt der
      Fehler fast nie in der Größe des Modulus, sondern in der Aufbereitung
      der Nachricht vor der Rechnung. Daneben steht, dass ein Schlüsselpaar
      genau einem Zweck dient und nicht zugleich signiert und verschlüsselt.
      Beides entscheidet über den Entwurf und kommt ohne Rechnung aus.
  all-staff:
    needed: false
    note: >
      Für alle Beschäftigten hat die Wahl eines Verfahrens keine
      Handlungsfolge.
  auditors:
    needed: false
    note: >
      Wer prüft, sieht nach, ob dasselbe Schlüsselpaar zwei Zwecken dient und
      ob eine geprüfte Umsetzung benutzt wird. Das sind Punkte in der Prüfung
      und kein eigener Kursstoff.
