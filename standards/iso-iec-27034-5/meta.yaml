id: iso-iec-27034-5
number: 27034
part: 5
edition_year: 2017
doc_type: is
status: published
family: extended-27000
layer: depth
isms_relation: controls
catalog_confirmation: confirmed
languages:
  - de
  - en
presentation:
  management:
    needed: false
    note: >
      Die Form, in der eine Maßnahme aufgeschrieben wird, ist keine
      Entscheidung der Leitung. Was sie an dieser Reihe angeht, steht im
      Foliensatz zu ISO/IEC 27016.
  practitioners:
    needed: false
    note: >
      Für die Praxis zählt, dass eine Maßnahme eine feste Form hat, und das
      trägt der Foliensatz zu ISO/IEC 27034-1. Welche Felder die Form im
      Austausch zwischen Werkzeugen hat, ist eine technische Frage.
  engineering:
    needed: false
    note: >
      Der Foliensatz zu ISO/IEC 27034-1 trägt die beiden Gedanken der Reihe.
      Ob ein Haus den Bestand maschinenlesbar führt, hängt an seinen Werkzeugen
      und an seiner Größe, und ein Satz dazu wäre für die meisten Leser ohne
      Gegenstand.
  all-staff:
    needed: false
    note: >
      Für alle Beschäftigten hat die Form einer Maßnahmenbeschreibung keine
      Handlungsfolge.
  auditors:
    needed: false
    note: >
      Wer prüft, liest den Bestand in der Form, in der er vorliegt. Ob diese
      Form maschinenlesbar ist, ändert am Vorgehen der Prüfung nichts.
